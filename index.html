<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>送你的专属星空粒子</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030305;
            font-family: sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #tip {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            pointer-events: none;
            letter-spacing: 2px;
            transition: opacity 0.3s;
            text-shadow: 0 0 10px rgba(255,100,150,0.5);
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    <div id="tip">💐 点击屏幕，见证花束绽放成画 💐</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        let particles = [];
        let mouseX = -9999;
        let mouseY = -9999;
        let hasMouse = false;
        let isMouseDown = false; 

        let mode = 'flower'; 
        let flowerAngle = 0;

        class Particle {
            constructor(flowerX, flowerY, flowerZ, photoX, photoY, photoZ, color) {
                this.flowerX = flowerX;
                this.flowerY = flowerY;
                this.flowerZ = flowerZ;

                this.photoX = photoX;
                this.photoY = photoY;
                this.photoZ = photoZ;

                this.color = color;
                
                this.x = (Math.random() - 0.5) * width * 3;
                this.y = (Math.random() - 0.5) * height * 3;
                this.z = (Math.random() - 0.5) * 800 - 400;

                this.vx = 0;
                this.vy = 0;
                this.vz = 0;

                this.size = Math.random() * 1.5 + 0.7;
            }

            update(time) {
                let targetX = 0, targetY = 0, targetZ = 0;

                if (mode === 'flower') {
                    let cos = Math.cos(flowerAngle);
                    let sin = Math.sin(flowerAngle);
                    targetX = this.flowerX * cos + this.flowerZ * sin;
                    targetZ = -this.flowerX * sin + this.flowerZ * cos;
                    targetY = this.flowerY + Math.sin(time * 0.002 + this.flowerX * 0.02) * 3; 

                } else if (mode === 'photo') {
                    if (isMouseDown) {
                        // 【按下鼠标时】：粒子彻底打散，向四周无规则爆开并失重乱飞
                        let pScreenX = this.x + width / 2;
                        let pScreenY = this.y + height / 2;
                        let disX = pScreenX - mouseX;
                        let disY = pScreenY - mouseY;
                        let distance = Math.sqrt(disX * disX + disY * disY);

                        let pushForce = 35;
                        let ax = (disX / (distance + 1)) * pushForce + (Math.random() - 0.5) * 20;
                        let ay = (disY / (distance + 1)) * pushForce + (Math.random() - 0.5) * 20;
                        let az = (Math.random() - 0.5) * 25;

                        this.vx = (this.vx + ax) * 0.90;
                        this.vy = (this.vy + ay) * 0.90;
                        this.vz = (this.vz + az) * 0.90;

                        this.x += this.vx;
                        this.y += this.vy;
                        this.z += this.vz;
                        return;
                    } else {
                        // 【松开鼠标时】：慢慢组合，温柔优雅地吸附回归原位
                        let waveX = this.photoX + Math.sin(time * 0.002 + this.photoY * 0.05) * 2;
                        let waveY = this.photoY + Math.cos(time * 0.002 + this.photoX * 0.05) * 2;
                        let waveZ = this.photoZ + Math.sin(time * 0.003) * 3;

                        targetX = waveX;
                        targetY = waveY;
                        targetZ = waveZ;

                        let dx = targetX - this.x;
                        let dy = targetY - this.y;
                        let dz = targetZ - this.z;

                        // 柔和的吸引加速度（让它们慢慢组合）
                        let ax = dx * 0.045; 
                        let ay = dy * 0.045;
                        let az = dz * 0.045;

                        // 平时日常的鼠标移动星系旋涡互动
                        if (hasMouse) {
                            let pScreenX = this.x + width / 2;
                            let pScreenY = this.y + height / 2;
                            let disX = mouseX - pScreenX;
                            let disY = mouseY - pScreenY;
                            let distance = Math.sqrt(disX * disX + disY * disY);

                            let pullRadius = 130; 
                            if (distance < pullRadius && distance > 2) {
                                let force = (1 - distance / pullRadius);
                                ax += (disX / distance) * force * 3.5 - (disY / distance) * force * 5.0;
                                ay += (disY / distance) * force * 3.5 + (disX / distance) * force * 5.0;
                                az += force * 10;
                            }
                        }

                        this.vx = (this.vx + ax) * 0.82;
                        this.vy = (this.vy + ay) * 0.82;
                        this.vz = (this.vz + az) * 0.82;

                        this.x += this.vx;
                        this.y += this.vy;
                        this.z += this.vz;
                        return;
                    }
                }

                let dx = targetX - this.x;
                let dy = targetY - this.y;
                let dz = targetZ - this.z;

                this.vx = (this.vx + dx * 0.08) * 0.82;
                this.vy = (this.vy + dy * 0.08) * 0.82;
                this.vz = (this.vz + dz * 0.08) * 0.82;

                this.x += this.vx;
                this.y += this.vy;
                this.z += this.vz;
            }

            draw() {
                let fov = 600;
                let distance = fov + this.z;
                if (distance < 1) distance = 1;
                let scale = fov / distance;

                let px = this.x * scale + width / 2;
                let py = this.y * scale + height / 2;

                if (px >= 0 && px <= width && py >= 0 && py <= height) {
                    let currentSize = (isMouseDown && mode === 'photo') ? this.size * 1.4 : this.size;
                    
                    ctx.fillStyle = `rgb(${this.color[0]}, ${this.color[1]}, ${this.color[2]})`;
                    ctx.beginPath();
                    ctx.arc(px, py, Math.max(0.5, currentSize * scale), 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function createBouquetParticles(photoParticles) {
            let total = photoParticles.length;
            for (let i = 0; i < total; i++) {
                let fx, fy, fz, rCol, gCol, bCol;
                
                let ratio = i / total;
                if (ratio < 0.75) {
                    let u = Math.random();
                    let v = Math.random();
                    let theta = u * 2.0 * Math.PI;
                    let phi = Math.acos(2.0 * v - 1.0);
                    let radius = 160 * Math.cbrt(Math.random()); 

                    fx = radius * Math.sin(phi) * Math.cos(theta);
                    fy = radius * Math.sin(phi) * Math.sin(theta) - 50; 
                    fz = radius * Math.cos(phi);

                    rCol = Math.floor(230 + Math.random() * 25);
                    gCol = Math.floor(120 + Math.random() * 80);
                    bCol = Math.floor(150 + Math.random() * 80);
                } else {
                    let t = (ratio - 0.75) / 0.25;
                    fx = (Math.random() - 0.5) * (t * 80 + 15);
                    fy = 80 + t * 140; 
                    fz = (Math.random() - 0.5) * (t * 80 + 15);

                    rCol = Math.floor(180 + Math.random() * 75);
                    gCol = Math.floor(150 + Math.random() * 50);
                    bCol = Math.floor(140 + Math.random() * 50);
                }

                photoParticles[i].flowerX = fx;
                photoParticles[i].flowerY = fy;
                photoParticles[i].flowerZ = fz;
                photoParticles[i].flowerColor = [rCol, gCol, bCol];
            }
        }

        const img = new Image();
        img.src = '6e943d83dc1edcc84e3cd3e35d2950b2.jpg'; 
        
        img.onload = function() {
            const tempCanvas = document.createElement('canvas');
            const tCtx = tempCanvas.getContext('2d');
            
            let maxDim = 720; 
            let scale = Math.min(maxDim / img.width, maxDim / img.height);
            let w = Math.floor(img.width * scale);
            let h = Math.floor(img.height * scale);
            
            tempCanvas.width = w;
            tempCanvas.height = h;
            tCtx.drawImage(img, 0, 0, w, h);
            
            const imgData = tCtx.getImageData(0, 0, w, h).data;
            particles = [];

            let step = 3; 
            for (let y = 0; y < h; y += step) {
                for (let x = 0; x < w; x += step) {
                    let index = (y * w + x) * 4;
                    let r = imgData[index];
                    let g = imgData[index + 1];
                    let b = imgData[index + 2];
                    let a = imgData[index + 3];

                    if (a > 100) {
                        let tx = x - w / 2;
                        let ty = y - h / 2;
                        let brightness = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
                        let tz = (brightness - 0.5) * 30; 

                        particles.push(new Particle(0, 0, 0, tx, ty, tz, [r, g, b]));
                    }
                }
            }

            createBouquetParticles(particles);
        };

        function animate(time) {
            ctx.fillStyle = 'rgba(3, 3, 5, 0.35)';
            ctx.fillRect(0, 0, width, height);

            if (mode === 'flower') {
                flowerAngle += 0.01; 
            }

            particles.forEach(p => {
                p.update(time);
                p.draw();
            });

            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);

        function triggerTransform(e) {
            if (mode === 'flower') {
                mode = 'photo';
                const tip = document.getElementById('tip');
                tip.style.opacity = '0';
                setTimeout(() => {
                    tip.innerText = '✨ 按下鼠标打散粒子，松开鼠标缓慢组合成画 ✨';
                    tip.style.opacity = '1';
                }, 400);
            }
            hasMouse = true;
            mouseX = e.clientX || (e.touches && e.touches[0].clientX);
            mouseY = e.clientY || (e.touches && e.touches[0].clientY);
        }

        window.addEventListener('mousemove', e => {
            hasMouse = true;
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        window.addEventListener('mousedown', e => {
            if (mode === 'flower') {
                triggerTransform(e);
            } else {
                isMouseDown = true;
                mouseX = e.clientX;
                mouseY = e.clientY;
                document.getElementById('tip').style.opacity = '0';
            }
        });

        window.addEventListener('mouseup', () => {
            isMouseDown = false;
            if (mode === 'photo') {
                document.getElementById('tip').style.opacity = '1';
            }
        });

        window.addEventListener('touchstart', e => {
            if (mode === 'flower') {
                triggerTransform(e);
            } else {
                isMouseDown = true;
                hasMouse = true;
                mouseX = e.touches[0].clientX;
                mouseY = e.touches[0].clientY;
                document.getElementById('tip').style.opacity = '0';
            }
        });

        window.addEventListener('touchmove', e => {
            hasMouse = true;
            mouseX = e.touches[0].clientX;
            mouseY = e.touches[0].clientY;
        });

        window.addEventListener('touchend', () => {
            isMouseDown = false;
            if (mode === 'photo') {
                document.getElementById('tip').style.opacity = '1';
            }
        });

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
